<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — MiniApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">🏋️ MiniApp</span>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">Вход</h5>
                </div>
                <div class="card-body">
                    <form method="post" action="/login">
                        <input name="username" type="text" class="form-control mb-2" placeholder="Логин">
                        <input name="password" type="password" class="form-control mb-2" placeholder="Пароль">
                        <button type="submit" class="btn btn-dark w-100">Войти</button>
                    </form>
                    <hr>
                    <a href="/register.html" class="btn btn-outline-success w-100">Нет аккаунта? Зарегистрироваться</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="error" class="alert alert-danger d-none">
    Неверный логин или пароль
</div>

<script>
    if (window.location.search.includes("error")) {
        document.getElementById("error").classList.remove("d-none");
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
