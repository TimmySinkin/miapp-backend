spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/miapp}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:sinkin2006}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- SMTP (Gmail) для отправки кода подтверждения email при регистрации ---
#
# Замените значения после двоеточия на свои (ваш Gmail и App Password),
# либо задайте переменные окружения MAIL_USERNAME / MAIL_PASSWORD перед
# запуском сервера — тогда именно они будут использованы, а не заглушка.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-sender-account@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-16-char-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Имя отправителя, которое видит получатель вместо email-адреса
# (например "MiniApp <ваша-почта@gmail.com>" вместо просто адреса).
# Сам адрес отправки при этом не меняется — Gmail не позволяет слать
# с чужого домена (типа noreply@sender.ozon.ru) без верификации домена в
# Google Workspace, поэтому реальный адрес всегда будет вашим Gmail-ящиком,
# меняется только видимое имя.
app.mail.sender-name=MiniApp

# --- Telegram Login Widget ---
# Токен вашего бота от @BotFather (тот, что вы уже получили).
# Используется ТОЛЬКО на бэкенде для проверки подписи данных от Telegram —
