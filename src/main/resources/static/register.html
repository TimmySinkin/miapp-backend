<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — MiniApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">🏋️ MiniApp</span>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Регистрация</h5>
                </div>
                <div class="card-body">
                    <input id="login" type="text" class="form-control mb-2" placeholder="Логин">
                    <input id="password" type="password" class="form-control mb-2" placeholder="Пароль">
                    <input id="name" type="text" class="form-control mb-2" placeholder="Имя">
                    <button class="btn btn-success w-100" onclick="register()">Зарегистрироваться</button>
                    <hr>
                    <a href="/login.html" class="btn btn-outline-secondary w-100">Уже есть аккаунт? Войти</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function register() {
        const login = document.getElementById("login").value;
        const password = document.getElementById("password").value;
        const name = document.getElementById("name").value;

        if (!login || !password || !name) {
            alert("Заполните все поля!");
            return;
        }

        fetch("/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ login, password, name })
        })
            .then(r => r.text())
            .then(msg => {
                alert(msg);
                if (msg === "Регистрация успешна!") {
                    window.location.href = "/login.html";
                }
            });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
